services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://app:secret@db:5432/cards
      SECRET_KEY: change-me-in-prod
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: cards
    volumes:
      - pg_data:/var/lib/postgresql/data
volumes:
  pg_data:
